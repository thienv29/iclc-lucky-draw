<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login - ICLC Lucky Draw</title>
    <link rel="stylesheet" href="/assets/lib/css/bootstrap.min.css" />

    <style>
      body {
        background: linear-gradient(135deg, #f3e8ff, #fef7ff);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .login-card {
        border: none;
        border-radius: 20px;
        box-shadow: 0 15px 35px rgba(102, 40, 114, 0.15);
        overflow: hidden;
        max-width: 400px;
        width: 100%;
      }

      .login-header {
        background: linear-gradient(135deg, #662872, #8b5cf6);
        text-align: center;
        padding: 30px 20px;
        color: white;
      }

      .login-header h4 {
        font-weight: 700;
        letter-spacing: 1px;
        margin: 0;
      }

      .login-body {
        padding: 30px;
        background: white;
      }

      .form-group {
        margin-bottom: 20px;
      }

      .form-control {
        border-radius: 10px;
        border: 1px solid #ced4da;
        padding: 12px 15px;
        font-size: 16px;
        transition: all 0.3s ease;
      }

      .form-control:focus {
        border-color: #662872;
        box-shadow: 0 0 0 0.2rem rgba(102, 40, 114, 0.25);
      }

      .btn-login {
        background: linear-gradient(135deg, #662872, #8b5cf6);
        border: none;
        border-radius: 10px;
        padding: 12px;
        font-weight: 600;
        color: white;
        width: 100%;
        font-size: 16px;
        transition: all 0.3s ease;
      }

      .btn-login:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(102, 40, 114, 0.3);
        color: white;
      }

      .btn-login:disabled {
        opacity: 0.7;
        cursor: not-allowed;
        transform: none;
      }

      .alert {
        border-radius: 10px;
        border: none;
      }

      .logo-section {
        text-align: center;
        margin-bottom: 20px;
      }

      .logo-section img {
        max-width: 120px;
        height: auto;
      }

      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .login-card {
        animation: fadeInUp 0.6s ease;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
          <div class="login-card">
            <div class="login-header">
              <div class="logo-section">
                <img src="/assets/logo-form.png" alt="ICLC Logo" />
              </div>
              <h4><i class="fas fa-lock"></i> Admin Access</h4>
              <p class="mb-0" style="font-size: 14px; opacity: 0.9;">ICLC Lucky Draw 2025</p>
            </div>
            <div class="login-body">
              <div id="alertContainer"></div>

              <form id="loginForm">
                <div class="form-group">
                  <label for="password" style="font-weight: 600; color: #333;">Password</label>
                  <input
                    type="password"
                    class="form-control"
                    id="password"
                    placeholder="Enter admin password"
                    required
                    autocomplete="current-password"
                  />
                </div>
                <button type="submit" class="btn btn-login" id="loginBtn">
                  <i class="fas fa-sign-in-alt"></i> Login
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="/assets/lib/js/jquery-3.3.1.slim.min.js"></script>
    <script src="/assets/lib/js/popper.min.js"></script>
    <script src="/assets/lib/js/bootstrap.min.js"></script>
    <script>
      document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault()

        const password = document.getElementById('password').value
        const loginBtn = document.getElementById('loginBtn')
        const alertContainer = document.getElementById('alertContainer')

        // Clear previous alerts
        alertContainer.innerHTML = ''

        // Disable button and show loading
        loginBtn.disabled = true
        loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verifying...'

        // Send login request
        fetch('/api/admin/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ password: password })
        })
        .then(response => response.json())
        .then(data => {
          if (data.success) {
            // Store token in localStorage for better persistence
            localStorage.setItem('adminToken', data.token)
            localStorage.setItem('adminLoginTime', Date.now().toString())

            // Redirect to admin page
            window.location.href = '/admin'
          } else {
            // Show error
            showAlert('danger', data.message || 'Invalid password')
            loginBtn.disabled = false
            loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login'
          }
        })
        .catch(error => {
          console.error('Login error:', error)
          showAlert('danger', 'Connection error. Please try again.')
          loginBtn.disabled = false
          loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login'
        })
      })

      function showAlert(type, message) {
        const alertContainer = document.getElementById('alertContainer')
        const alertClass = type === 'danger' ? 'alert-danger' : 'alert-success'
        const iconClass = type === 'danger' ? 'fas fa-exclamation-triangle' : 'fas fa-check-circle'

        alertContainer.innerHTML = `
          <div class="alert ${alertClass} alert-dismissible fade show" role="alert">
            <i class="${iconClass}"></i> ${message}
            <button type="button" class="close" data-dismiss="alert">
              <span>&times;</span>
            </button>
          </div>
        `
      }

      // Check if already logged in
      document.addEventListener('DOMContentLoaded', function() {
        const token = localStorage.getItem('adminToken')
        const loginTime = localStorage.getItem('adminLoginTime')

        if (token && loginTime) {
          // Check if session is still valid (24 hours)
          const hoursSinceLogin = (Date.now() - parseInt(loginTime)) / (1000 * 60 * 60)
          if (hoursSinceLogin < 24) {
            // Redirect to admin if still logged in
            window.location.href = '/admin'
          } else {
            // Clear expired session
            localStorage.removeItem('adminToken')
            localStorage.removeItem('adminLoginTime')
          }
        }
      })
    </script>
  </body>
</html>
