<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Check-in YEP</title>
    <link rel="stylesheet" href="./assets/lib/css/bootstrap.min.css" />

    <style>
      body {
        background: linear-gradient(135deg, #f3e8ff, #fef7ff);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }

      .card {
        border: none;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(102, 40, 114, 0.1);
        animation: fadeInUp 0.6s ease;
        overflow: hidden;
      }

      .card-header {
        background: linear-gradient(135deg, #662872, #8b5cf6) !important;
        text-align: center;
        padding: 20px;
      }

      .card-header h4 {
        font-weight: 700;
        letter-spacing: 1px;
      }

      .card-body {
        padding: 40px;
        background-color: #ffffff;
      }

      .form-group {
        margin-bottom: 25px;
      }

      .form-group:last-child {
        margin-bottom: 35px;
      }

      .form-group label {
        font-weight: 600;
        color: #333;
        margin-bottom: 8px;
        font-size: 14px;
      }

      .form-control {
        border-radius: 10px;
        border: 1px solid #ced4da;
        transition: all 0.3s ease;
        height: 60px;
        min-height: 60px;
        max-height: 60px;
        box-sizing: border-box;
      }

      .form-control:focus {
        border-color: #662872;
        box-shadow: 0 0 0 0.15rem rgba(102, 40, 114, 0.25);
      }

      .dropdown-list {
        position: absolute;
        bottom: 100%;
        left: 0;
        right: 0;
        background: white;
        border: 1px solid #ced4da;
        border-radius: 10px;
        box-shadow: 0 4px 15px rgba(102, 40, 114, 0.2);
        max-height: 200px;
        overflow-y: auto;
        overflow-x: hidden;
        z-index: 1000;
        display: none;
      }

      .dropdown-item {
        padding: 16px 18px;
        cursor: pointer;
        border-bottom: 1px solid #f0f0f0;
        transition: all 0.3s ease;
        height: 55px;
        display: flex;
        align-items: center;
        font-size: 15px;
        font-weight: 500;
        color: #333;
        position: relative;
        background: linear-gradient(135deg, #ffffff 0%, #fafafa 100%);
      }

      .dropdown-item.active {
        background: linear-gradient(135deg, #662872 0%, #8b5cf6 100%);
        color: white;
        transform: translateX(5px);
        box-shadow: 0 2px 8px rgba(102, 40, 114, 0.3);
      }

      .dropdown-item:last-child {
        border-bottom: none;
        border-radius: 0 0 10px 10px;
      }

      .dropdown-item:first-child {
        border-radius: 10px 10px 0 0;
      }

      .input-wrapper {
        position: relative;
      }

      textarea.form-control {
        resize: none;
      }

      .btn-primary {
        border-radius: 12px;
        padding: 15px 20px;
        font-weight: 700;
        font-size: 16px;
        letter-spacing: 0.5px;
        background: linear-gradient(135deg, #662872, #8b5cf6);
        border: none;
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
        box-shadow: 0 4px 15px rgba(102, 40, 114, 0.3);
      }

      .btn-primary::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.2),
          transparent
        );
        transition: left 0.5s;
      }

      .btn-primary:hover::before {
        left: 100%;
      }

      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(102, 40, 114, 0.4);
      }

      .btn-primary:active {
        transform: translateY(0);
        box-shadow: 0 2px 10px rgba(102, 40, 114, 0.3);
      }

      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Mobile optimizations */
      @media (max-width: 768px) {
        .card-body {
          padding: 25px 20px;
        }

        .card-header {
          padding: 15px;
        }

        .card-header h4 {
          font-size: 18px;
          letter-spacing: 0.5px;
        }

        .form-control {
          height: 50px;
          min-height: 50px;
          max-height: 50px;
          font-size: 16px; /* Prevents zoom on iOS */
        }

        .dropdown-item {
          height: 50px;
          padding: 14px 16px;
          font-size: 14px;
        }

        .btn-primary {
          padding: 12px 16px;
          font-size: 15px;
        }

        .form-group label {
          font-size: 13px;
          margin-bottom: 6px;
        }

        .form-group {
          margin-bottom: 20px;
        }

        .form-group:last-child {
          margin-bottom: 30px;
        }

        body {
          padding: 10px;
        }

        .container-fluid {
          padding: 0;
        }

        img.img-fluid {
          max-width: 150px;
        }
      }

      @media (max-width: 480px) {
        .card-body {
          padding: 20px 15px;
        }

        .card-header {
          padding: 12px;
        }

        .card-header h4 {
          font-size: 16px;
        }

        .form-control {
          height: 48px;
          min-height: 48px;
          max-height: 48px;
          font-size: 16px;
        }

        .dropdown-item {
          height: 48px;
          padding: 12px 14px;
          font-size: 13px;
        }

        .btn-primary {
          padding: 10px 14px;
          font-size: 14px;
        }

        img.img-fluid {
          max-width: 120px;
        }

        .card {
          margin: 0;
        }
      }
    </style>
  </head>
  <body>
    <div
      class="container-fluid d-flex align-items-center justify-content-center min-vh-100"
    >
      <div class="row justify-content-center w-100">
        <div class="col-md-8 col-lg-6">
          <!-- Logo Section -->
          <div class="text-center mb-4">
            <img
              src="./assets/logo-form.png"
              alt="ICLC Logo"
              class="img-fluid"
              style="max-width: 200px; height: auto"
            />
          </div>

          <div class="card">
            <div class="card-header bg-primary text-white">
              <h4 class="card-title mb-0">I-CLC YEP 2025</h4>
            </div>
            <div class="card-body">
              <form id="inputForm">
                <div class="form-group">
                  <label for="department">You are</label>
                  <select class="form-control" id="departmentSelect" required>
                    <option value="">Select Department / Guest</option>
                  </select>
                </div>
                <div class="form-group">
                  <label for="customer">Full Name</label>
                  <div class="input-wrapper">
                    <input
                      type="text"
                      class="form-control"
                      id="customerSearch"
                      placeholder="Search your name..."
                      autocomplete="off"
                      required
                      disabled
                    />
                    <input type="hidden" id="customerId" name="customerId" />
                    <div class="dropdown-list" id="customersDropdown"></div>
                  </div>
                </div>
                <!-- Note field hidden as requested -->
                <input type="hidden" id="note" name="note" value="" />
                <button type="submit" class="btn btn-primary btn-block">
                  CHECK-IN
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Success Modal -->
    <div
      class="modal fade"
      id="successModal"
      tabindex="-1"
      role="dialog"
      aria-labelledby="successModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered" role="document">
        <div
          class="modal-content"
          style="
            border: none;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(102, 40, 114, 0.3);
          "
        >
          <div class="modal-body text-center p-5">
            <div class="success-icon mb-4">
              <div
                style="
                  width: 80px;
                  height: 80px;
                  background: linear-gradient(135deg, #662872, #8b5cf6);
                  border-radius: 50%;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  margin: 0 auto;
                  box-shadow: 0 10px 30px rgba(102, 40, 114, 0.3);
                "
              >
                <svg
                  width="40"
                  height="40"
                  viewBox="0 0 24 24"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <path
                    d="M20 6L9 17L4 12"
                    stroke="white"
                    stroke-width="3"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </div>
            </div>
            <h2
              class="mb-3"
              style="color: #662872; font-weight: 700; font-size: 32px"
            >
              You have successfully checked in!
            </h2>
            <p class="mb-2" style="color: #666; font-size: 1.1em">
              Your lucky number is:
            </p>
            <div class="lucky-number-display mb-4">
              <span
                id="luckyNumberDisplay"
                style="
                  font-size: 3em;
                  font-weight: 900;
                  color: #662872;
                  text-shadow: 2px 2px 4px rgba(102, 40, 114, 0.3);
                "
                >#</span
              >
            </div>
            <p class="mb-4" style="color: #888">
              Wishing you a wonderful evening with I-CLC!
            </p>
            <button
              type="button"
              class="btn"
              data-dismiss="modal"
              style="
                background: linear-gradient(135deg, #662872, #8b5cf6);
                color: white;
                border: none;
                border-radius: 12px;
                padding: 12px 30px;
                font-weight: 600;
                transition: all 0.3s ease;
              "
            >
              OK
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="./assets/lib/js/jquery-3.3.1.slim.min.js"></script>
    <script src="./assets/lib/js/popper.min.js"></script>
    <script src="./assets/lib/js/bootstrap.min.js"></script>
    <script>
      let customers = []
      let selectedIndex = -1

      // Load departments and setup form on page load
      document.addEventListener('DOMContentLoaded', function () {
        loadDepartments()

        // Check if this device has already checked in today
        const lastCheckinDate = localStorage.getItem('iclc_checkin_date')
        const today = new Date().toDateString()

        if (lastCheckinDate === today) {
          // Device has already checked in today, disable the form
          disableFormForDevice()
        }

        // Setup department change handler
        document
          .getElementById('departmentSelect')
          .addEventListener('change', function () {
            const selectedDepartment = this.value
            const customerSearchInput =
              document.getElementById('customerSearch')

            if (selectedDepartment) {
              loadCustomersByDepartment(selectedDepartment)
              customerSearchInput.disabled = false
              setupSearchDropdown()
            } else {
              customerSearchInput.disabled = true
              customerSearchInput.value = ''
              customerSearchInput.placeholder = 'Search your name...'
              document.getElementById('customerId').value = ''
              customers = []
              hideDropdown()
            }
          })
      })

      function loadDepartments() {
        fetch('/api/departments')
          .then((response) => response.json())
          .then((departments) => {
            const departmentSelect = document.getElementById('departmentSelect')
            departmentSelect.innerHTML =
              '<option value="">Choose your role...</option>'

            departments.forEach((department) => {
              const option = document.createElement('option')
              option.value = department
              option.textContent = department
              departmentSelect.appendChild(option)
            })
          })
          .catch((error) => {
            console.error('Error loading departments:', error)
            const departmentSelect = document.getElementById('departmentSelect')
            departmentSelect.innerHTML =
              '<option value="">Error loading departments</option>'
            departmentSelect.disabled = true
          })
      }

      function loadCustomersByDepartment(department) {
        fetch(
          `/api/customers-by-department?department=${encodeURIComponent(
            department
          )}`
        )
          .then((response) => response.json())
          .then((data) => {
            customers = data
            // Show all customers initially (no search term)
            showDropdown('')
          })
          .catch((error) => {
            console.error('Error loading customers:', error)
            customers = []
            hideDropdown()
          })
      }

      function setupSearchDropdown() {
        const searchInput = document.getElementById('customerSearch')
        const dropdown = document.getElementById('customersDropdown')

        // Show dropdown on focus/click
        searchInput.addEventListener('focus', function () {
          showDropdown('')
        })

        searchInput.addEventListener('click', function () {
          showDropdown('')
        })

        // Filter dropdown on input
        searchInput.addEventListener('input', function () {
          const searchTerm = this.value.toLowerCase()
          showDropdown(searchTerm)
        })

        // Hide dropdown when clicking outside
        document.addEventListener('click', function (e) {
          if (!searchInput.contains(e.target) && !dropdown.contains(e.target)) {
            hideDropdown()
          }
        })

        // Handle keyboard navigation
        searchInput.addEventListener('keydown', function (e) {
          const items = dropdown.querySelectorAll('.dropdown-item')

          if (e.key === 'ArrowDown') {
            e.preventDefault()
            selectedIndex = Math.min(selectedIndex + 1, items.length - 1)
            updateSelection(items)
          } else if (e.key === 'ArrowUp') {
            e.preventDefault()
            selectedIndex = Math.max(selectedIndex - 1, -1)
            updateSelection(items)
          } else if (e.key === 'Enter') {
            e.preventDefault()
            if (selectedIndex >= 0 && items[selectedIndex]) {
              selectCustomer(items[selectedIndex])
            }
          } else if (e.key === 'Escape') {
            hideDropdown()
          }
        })
      }

      function showDropdown(searchTerm) {
        const dropdown = document.getElementById('customersDropdown')
        dropdown.innerHTML = ''

        const filteredCustomers = customers.filter(
          (customer) =>
            !searchTerm ||
            customer.name.toLowerCase().includes(searchTerm) ||
            (customer.department &&
              customer.department.toLowerCase().includes(searchTerm))
        )

        if (filteredCustomers.length === 0) {
          const noResult = document.createElement('div')
          noResult.className = 'dropdown-item'
          noResult.textContent = 'No customers found'
          noResult.style.color = '#6c757d'
          noResult.style.cursor = 'default'
          dropdown.appendChild(noResult)
        } else {
          // Get selected department to determine display format
          const selectedDepartment =
            document.getElementById('departmentSelect').value

          filteredCustomers.forEach((customer, index) => {
            const item = document.createElement('div')
            item.className = 'dropdown-item'

            // For Employee category, show "Name - Department"
            // For other categories, show only "Name"
            if (selectedDepartment === 'Employee') {
              item.textContent = `${customer.name} - ${
                customer.department || 'No Department'
              }`
            } else {
              item.textContent = customer.name
            }

            item.setAttribute('data-id', customer.id)
            item.setAttribute('data-index', index)

            item.addEventListener('click', function () {
              selectCustomer(this)
            })

            item.addEventListener('mouseenter', function () {
              selectedIndex = parseInt(this.getAttribute('data-index'))
              updateSelection(dropdown.querySelectorAll('.dropdown-item'))
            })

            dropdown.appendChild(item)
          })
        }

        dropdown.style.display = 'block'
        selectedIndex = -1
      }

      function hideDropdown() {
        const dropdown = document.getElementById('customersDropdown')
        dropdown.style.display = 'none'
        selectedIndex = -1
      }

      function updateSelection(items) {
        items.forEach((item, index) => {
          if (index === selectedIndex) {
            item.classList.add('active')
          } else {
            item.classList.remove('active')
          }
        })
      }

      function selectCustomer(item) {
        const customerId = item.getAttribute('data-id')
        const customerName = item.textContent

        document.getElementById('customerSearch').value = customerName
        document.getElementById('customerId').value = customerId

        hideDropdown()
      }

      function disableFormForDevice() {
        const form = document.getElementById('inputForm')
        const inputs = form.querySelectorAll('input, select, textarea, button')
        const warningDiv = document.createElement('div')

        warningDiv.className = 'alert alert-warning text-center mb-3'
        warningDiv.innerHTML = `
          <i class="fas fa-exclamation-triangle"></i>
          <strong style="font-size: 0.9em;">
You have already checked in!</strong><br>
        `

        // Insert warning at the top of the card body
        const cardBody = document.querySelector('.card-body')
        cardBody.insertBefore(warningDiv, cardBody.firstChild)

        // Disable all form inputs
        inputs.forEach((input) => {
          input.disabled = true
        })

        // Hide the dropdown
        const dropdown = document.getElementById('customersDropdown')
        if (dropdown) {
          dropdown.style.display = 'none'
        }
      }

      document
        .getElementById('inputForm')
        .addEventListener('submit', function (event) {
          event.preventDefault()

          const customerId = document.getElementById('customerId').value
          const note = document.getElementById('note').value

          if (!customerId) {
            alert('Please select your name from the list.')
            return
          }

          const data = {
            customerId: customerId,
            note: note,
          }

          // Send data to server
          fetch('/checkin', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify(data),
          })
            .then((response) => response.json())
            .then((result) => {
              if (result.success) {
                // Mark device as checked in
                const today = new Date().toDateString()
                localStorage.setItem('iclc_checkin_date', today)

                // Show success modal with lucky number
                document.getElementById('luckyNumberDisplay').textContent =
                  '#' + result.luckyNumber
                $('#successModal').modal('show')

                // Reset form when modal is closed
                $('#successModal').on('hidden.bs.modal', function () {
                  document.getElementById('inputForm').reset()
                  document.getElementById('customerId').value = ''
                  document.getElementById('customerSearch').disabled = true
                  customers = []
                  hideDropdown()
                  // Disable form after successful check-in
                  disableFormForDevice()
                })
              } else {
                alert('Error: ' + result.message)
              }
            })
            .catch((error) => {
              console.error('Error:', error)
              alert('An error occurred while submitting the form.')
            })
        })
    </script>
  </body>
</html>
